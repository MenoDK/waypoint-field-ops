name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, formatting, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cheapest, fastest signal first.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm site-syntax
      - run: pnpm test

  database:
    name: Tests on a real PostGIS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waypoint
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d waypoint" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The tests migrate this database themselves, run the real application on an ephemeral port and arrange their own fleets.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waypoint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  mutation:
    name: Critical rules are guarded (mutation check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, database]
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waypoint
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d waypoint" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waypoint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Breaks each of 22 rules on purpose, one at a time; the job fails if any broken rule still passes the tests.
      - run: node scripts/mutation-check.mjs

  docker:
    name: Image builds and refuses a bad configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, database]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: waypoint-field-ops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image refuses to start without its configuration, and says why
        run: |
          if docker run --rm waypoint-field-ops:ci; then echo "started with no configuration"; exit 1; fi
      - name: The image refuses the lab in production
        run: |
          # Throwaway secrets generated here, so no secret-shaped literal sits in the repository.
          out=$(docker run --rm -e NODE_ENV=production -e LAB_MODE=true -e DATABASE_URL=postgres://x@db/x \
            -e JWT_SECRET="$(openssl rand -hex 32)" -e SIGNED_URL_SECRET="$(openssl rand -hex 32)" \
            -e DEMO_PASSWORD=demo-password waypoint-field-ops:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -F "LAB_MODE must not be enabled in production"

  e2e:
    name: Browser tests (lab, accessibility, 14 languages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, database]
    steps:
      - uses: actions/checkout@v4
      # The command a reviewer runs locally: builds the image, starts PostGIS, the API, the worker and the simulated field,
      # and drives them with Playwright.
      - name: make e2e
        run: make e2e
        env:
          CI: 'true'
      - name: Keep the Playwright report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results
          if-no-files-found: ignore
      - name: Service logs on failure
        if: failure()
        run: docker compose -p waypoint logs api worker field migrate db

  security:
    name: Secrets and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary, pinned and checksum-verified, instead of gitleaks-action: the action scans "<first commit>^..HEAD",
      # and the first commit of a new repository has no parent, so it fails on the very first push.
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          v=8.24.3
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          archive=gitleaks_${v}_linux_x64.tar.gz # keep the release's file name: the checksum list refers to it
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${v}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${v}_checksums.txt" | grep -F "$archive: OK"
          tar xzf "$archive" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks git --no-banner --redact -v .
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
