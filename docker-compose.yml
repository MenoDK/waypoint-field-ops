# A small fleet-operations stack, with its phones and its road router simulated.
#   make demo   builds and starts everything; open http://localhost:8400
#   make e2e    runs the browser tests against the same stack
# Every secret comes from .env (make env writes one with fresh random values). Nothing here is a real credential.
#
# Who holds which database credential:
#   migrate  the schema owner (it creates the unprivileged role and the tables, then exits)
#   api, worker   the unprivileged `app_user` only -- a compromised API cannot alter the schema or rewrite history
name: waypoint

x-service: &service
  build: .
  image: waypoint-field-ops:local
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

x-app-database: &app-database
  DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?run "make env" first}@db:5432/waypoint

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: waypoint_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run "make env" first}
      POSTGRES_DB: waypoint
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose: while the image initialises, a throw-away server answers on the Unix socket only, and a check
      # that passed then would let the migration job connect to a port nobody listens on yet.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U waypoint_owner -d waypoint']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies db/migrations and exits 0. The only container that is given the owner's credential.
  migrate:
    <<: *service
    restart: 'no'
    command: ['node', 'dist/database/migrate-cli.js']
    environment:
      MIGRATION_DATABASE_URL: postgresql://waypoint_owner:${DB_PASSWORD}@db:5432/waypoint
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run "make env" first}
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *service
    ports: ['127.0.0.1:8400:3000']
    environment:
      <<: *app-database
      NODE_ENV: development
      PORT: '3000'
      JWT_SECRET: ${JWT_SECRET:?run "make env" first}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:?run "make env" first}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # The lab: levers that move time and break the stand-ins. The configuration refuses all of this in production.
      LAB_MODE: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:?run "make env" first}
      SITE_DIR: /app/site
      FIELD_URL: http://field:9500
      ROUTER_URL: http://field:9501
      # Short thresholds so a visitor sees an alert fire in a minute rather than a quarter of an hour.
      NO_SIGNAL_MINUTES: '1'
      LONG_STOP_MINUTES: '2'
      ARRIVING_MINUTES: '5'
      PASSWORD_SCRYPT_LOG2_N: '12'
      SIGNED_URL_TTL_SECONDS: '30'
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *service
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-database
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET}
      ROUTER_URL: http://field:9501
      NO_SIGNAL_MINUTES: '1'
      LONG_STOP_MINUTES: '2'
      ARRIVING_MINUTES: '5'
      WORKER_TICK_SECONDS: '5'
      WORKER_HEARTBEAT_FILE: /tmp/worker.heartbeat
    healthcheck:
      # Healthy while a tick finished in the last 30 seconds (the heartbeat file is rewritten after each good one).
      test:
        [
          'CMD',
          'node',
          '-e',
          "process.exit(Date.now()-require('fs').statSync('/tmp/worker.heartbeat').mtimeMs<30000?0:1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The simulated phones and road router. Lab only: it is the thing the lab breaks on purpose.
  field:
    <<: *service
    command: ['node', 'dist/standin/main.js']
    environment:
      API_URL: http://api:3000
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      CONTROL_PORT: '9500'
      ROUTER_PORT: '9501'
      # Five phones. driver4 of the first fleet has none on purpose: the lab's Ingest tab is that driver, sent by hand.
      FIELD_DRIVERS: driver1@prairie.example.test,driver2@prairie.example.test,driver3@prairie.example.test,driver1@harbor.example.test,driver2@harbor.example.test
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9500/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  # Browser tests. They share the API's network namespace, so the page is http://localhost:3000, a secure context.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    network_mode: 'service:api'
    working_dir: /work/e2e
    volumes:
      - ./e2e:/work/e2e
      - ./docs/img:/work/docs/img
    environment:
      E2E_BASE_URL: http://localhost:3000
      CI: '1'
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_healthy }
      field: { condition: service_healthy }
    command: ['bash', '-lc', 'npm ci --no-audit --no-fund && npx tsc --noEmit && npx playwright test']

volumes:
  dbdata:
